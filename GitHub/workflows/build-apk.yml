# Anime Partner — build the Android APK on GitHub.
#
# Upload the repository, open the Actions tab, and this compiles and signs the
# APK. No setup, no secrets, nothing to configure: the signing key is in the
# repository at android/release.p12, so every build can update the one before it.
#
#   Actions tab  -> Build APK -> the run page
#   Artifacts    -> anime-partner-apk  (download, unzip, install)
#   Releases     -> the same APK attached, with a one-click download link
#
# Optional hardening: if you add a repository secret ANDROID_KEYSTORE_B64 (and
# ANDROID_KEYSTORE_PASS), that key is used instead of the committed one.

name: Build APK

on:
  # "Run workflow" button on the Actions tab — works on any branch.
  workflow_dispatch:
  # ...and automatically whenever the app or the Android sources change.
  push:
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

concurrency:
  group: build-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build-tools 34 and platform 34
        run: sdkmanager --install "build-tools;34.0.0" "platforms;android-34"

      - name: Pick the signing key
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
        run: |
          set -e
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/keystore.p12"
            echo "pass=${KEYSTORE_PASS:-animepartner}" >> "$GITHUB_OUTPUT"
            echo "Using the keystore from the repository secret."
          elif [ -f android/release.p12 ]; then
            cp android/release.p12 "$RUNNER_TEMP/keystore.p12"
            echo "pass=${KEYSTORE_PASS:-animepartner}" >> "$GITHUB_OUTPUT"
            echo "Using the signing key committed at android/release.p12."
          else
            keytool -genkeypair -storetype PKCS12 -keystore "$RUNNER_TEMP/keystore.p12" \
              -alias animepartner -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass animepartner -keypass animepartner \
              -dname "CN=Shin, OU=Anime Partner, O=Shin, L=Shakargarh, ST=Punjab, C=PK"
            echo "pass=animepartner" >> "$GITHUB_OUTPUT"
            echo "::warning::No key found, so a throwaway one was generated. This APK cannot update an install signed with a different key — add android/release.p12 to keep updates working."
          fi
          echo "key=$RUNNER_TEMP/keystore.p12" >> "$GITHUB_OUTPUT"

      - name: Build and sign the APK
        id: build
        env:
          KS: ${{ steps.key.outputs.key }}
          KS_PASS: ${{ steps.key.outputs.pass }}
          KS_ALIAS: animepartner
        run: bash android/ci-build.sh

      - name: Name the file
        id: name
        run: |
          V="${{ steps.build.outputs.apk_version }}"
          C="${{ steps.build.outputs.apk_code }}"
          cp android/build/anime-partner.apk anime-partner.apk
          cp android/build/anime-partner.apk "anime-partner-v$V-$C.apk"
          echo "tag=v$V+$C" >> "$GITHUB_OUTPUT"
          echo "title=Anime Partner $V (build $C)" >> "$GITHUB_OUTPUT"
          ls -l anime-partner*.apk

      # This is the download you used before: Actions -> this run -> Artifacts.
      - name: Upload the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-partner-apk
          path: anime-partner*.apk
          retention-days: 90
          if-no-files-found: error

      # And the nicer link: a release whose APK downloads in one click.
      - name: Publish a Release with the APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.name.outputs.tag }}
          TITLE: ${{ steps.name.outputs.title }}
        run: |
          NOTES="Android APK, signed. The same build that is live on the website.

          * Works offline after the first open. No account, no ads, nothing leaves your device.
          * Japanese pronunciation plays through the phone's own speech engine.
          * Android 5.0 (API 21) and newer.

          Install: download anime-partner.apk, open it, allow \"Install unknown apps\" once.
          Installing over an older copy keeps your library, coins and streak.

          Developed by Shin."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" anime-partner.apk --clobber
          else
            gh release create "$TAG" anime-partner.apk --title "$TITLE" --notes "$NOTES" --latest
          fi
          echo "Release: $(gh release view "$TAG" --json url -q .url)"

      - name: Where to find the APK
        run: |
          echo "### APK ready :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "* **Artifacts** (bottom of this run page): \`anime-partner-apk\`" >> $GITHUB_STEP_SUMMARY
          echo "* **Releases**: ${{ steps.name.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "* Version: ${{ steps.build.outputs.apk_version }} (build ${{ steps.build.outputs.apk_code }})" >> $GITHUB_STEP_SUMMARY
